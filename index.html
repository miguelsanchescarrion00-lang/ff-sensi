<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>GOAT SENSI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:white;background:radial-gradient(circle at 50% -10%,#550000 0%,#180000 25%,#070707 60%,#000 100%);}
.page{width:100%;max-width:560px;margin:auto;padding:20px 12px 40px;}
.logo-area{text-align:center;margin:15px 0 30px;}
.logo{font-size:46px;font-weight:1000;letter-spacing:3px;color:white;text-shadow:0 2px 0 #9b0000,0 4px 0 #650000,0 6px 0 #350000,0 0 15px red,0 0 35px red;}
.subtitle{margin-top:8px;color:#999;font-size:13px;letter-spacing:1px;}
.card,.fale-conosco,.bot-ajuda{padding:22px;border-radius:22px;background:linear-gradient(145deg,#242424,#090909);border:1px solid rgba(255,0,0,.45);box-shadow:0 15px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}
.red-line{width:100%;height:3px;margin-bottom:20px;border-radius:20px;background:linear-gradient(90deg,transparent,red,#ff7777,red,transparent);box-shadow:0 0 15px red;}
label{display:block;margin:16px 0 7px;color:#eee;font-size:13px;font-weight:bold;}
select{width:100%;padding:14px;border-radius:13px;border:1px solid #444;outline:none;background:#111;color:white;font-size:15px;}
select:focus{border-color:red;box-shadow:0 0 12px rgba(255,0,0,.25);}
select:disabled{opacity:.5;}
.btn{width:100%;margin-top:22px;padding:16px;border:0;border-radius:14px;background:linear-gradient(145deg,#ff3030,#b90000);color:white;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #610000;transition:.1s;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #610000;}
.aviso{display:none;margin-top:14px;padding:11px;border-radius:10px;text-align:center;color:#ff7070;background:rgba(255,0,0,.08);border:1px solid rgba(255,0,0,.25);}
.resultado{display:none;margin-top:22px;padding:18px;border-radius:18px;background:#0b0b0b;border:1px solid rgba(255,0,0,.35);}
.result-title{text-align:center;margin-bottom:12px;color:#ff2525;font-weight:900;}
.sensi{display:flex;justify-content:space-between;align-items:center;padding:12px 5px;border-bottom:1px solid #292929;}
.valor{min-width:55px;padding:6px 10px;border-radius:8px;text-align:center;font-weight:900;background:linear-gradient(145deg,#ff2525,#a00000);}
.copy-btn{background:linear-gradient(145deg,#292929,#0c0c0c);border:1px solid red;}
.fale-conosco,.bot-ajuda{margin-top:20px;text-align:center;}
.fale-titulo,.bot-titulo{color:#ff2525;font-size:18px;font-weight:900;margin-bottom:9px;}
.fale-texto,.bot-texto{color:#999;font-size:13px;line-height:1.5;margin-bottom:16px;}
.whatsapp-btn,.bot-btn{display:block;width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(145deg,#ff3030,#bd0000);color:white;text-decoration:none;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #610000;}
.bot-btn:active,.whatsapp-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #610000;}
.creditos{margin-top:25px;text-align:center;color:#666;font-size:11px;line-height:1.7;}
.creditos strong{color:#999;}
.chat-overlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.8);padding:12px;align-items:center;justify-content:center;}
.chat-overlay.aberto{display:flex;}
.chat{width:100%;max-width:430px;height:620px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:#090909;border:1px solid red;box-shadow:0 0 40px rgba(255,0,0,.3);}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:linear-gradient(145deg,#3a0000,#110000);border-bottom:1px solid #4a0000;}
.bot-identidade{display:flex;align-items:center;gap:10px;}
.bot-avatar{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(145deg,#ff3030,#850000);font-size:21px;}
.bot-nome{font-size:14px;font-weight:900;}
.bot-status{margin-top:3px;color:#aaa;font-size:10px;}
.fechar-chat{width:35px;height:35px;border:0;border-radius:50%;background:#2a2a2a;color:white;font-size:18px;cursor:pointer;}
.chat-mensagens{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:9px;}
.mensagem{max-width:85%;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.45;}
.bot-msg{align-self:flex-start;background:#202020;border:1px solid #303030;}
.user-msg{align-self:flex-end;background:linear-gradient(145deg,#d40000,#870000);}
