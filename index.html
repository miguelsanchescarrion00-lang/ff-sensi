<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>GOAT SENSI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% -10%, #550000 0%, #180000 25%, #070707 60%, #000 100%);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    top: -200px;
    left: -180px;
    background: red;
    opacity: .08;
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    right: -200px;
    bottom: -200px;
    background: red;
    opacity: .07;
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
}

.page {
    width: 100%;
    max-width: 560px;
    margin: auto;
    padding: 25px 15px 40px;
    position: relative;
    z-index: 2;
}

/* LOGO */

.logo-area {
    text-align: center;
    margin: 15px 0 30px;
    perspective: 800px;
}

.logo {
    display: inline-block;
    font-size: 47px;
    font-weight: 1000;
    letter-spacing: 3px;
    color: white;

    text-shadow:
        0 2px 0 #9b0000,
        0 4px 0 #650000,
        0 6px 0 #350000,
        0 0 12px red,
        0 0 30px red,
        0 0 55px rgba(255,0,0,.7);

    transform:
        rotateX(8deg)
        rotateY(-3deg);

    animation: flutuar 3s ease-in-out infinite;
}

@keyframes flutuar {
    0%,100% {
        transform: rotateX(8deg) rotateY(-3deg) translateY(0);
    }

    50% {
        transform: rotateX(8deg) rotateY(-3deg) translateY(-7px);
    }
}

.subtitle {
    margin-top: 8px;
    color: #999;
    font-size: 13px;
    letter-spacing: 1px;
}
