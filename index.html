<script>
(function () {
  "use strict";

  const DADOS = {
    Samsung: ["Galaxy A05","Galaxy A05s","Galaxy A06","Galaxy A12","Galaxy A13","Galaxy A14","Galaxy A15","Galaxy A16","Galaxy A17","Galaxy A22","Galaxy A23","Galaxy A24","Galaxy A25","Galaxy A32","Galaxy A33","Galaxy A34","Galaxy A52","Galaxy A53","Galaxy A54","Galaxy A55","Galaxy A72","Galaxy S20","Galaxy S21","Galaxy S22","Galaxy S23","Galaxy S24","Galaxy S25"],
    Xiaomi: ["Redmi Note 8","Redmi Note 9","Redmi Note 10","Redmi Note 11","Redmi Note 12","Redmi Note 13","Redmi Note 14","POCO X3","POCO X4","POCO X5","POCO X6","POCO F5","POCO F6"],
    Motorola: ["Moto E5","Moto E6","Moto E7","Moto E20","Moto E22","Moto E32","Moto G5","Moto G7","Moto G8","Moto G9 Play","Moto G20","Moto G22","Moto G23","Moto G30","Moto G32","Moto G42","Moto G52","Moto G54","Moto G73","Moto G84","Motorola Edge 20","Motorola Edge 30","Motorola Edge 40","Motorola Edge 50 Fusion"]
  };

  const NIVEIS = { baixa: 90, media: 140, alta: 180 };
  const DEDOS_AJUSTE = { "2": 0, "3": 5, "4": 10 };

  function limitar(v){ return Math.max(0, Math.min(200, Math.round(v))); }
  function aleatorio(){ return Math.floor(Math.random()*7)-3; }

  document.addEventListener("DOMContentLoaded", function(){
    // Pega os selects pela ordem da tela do seu print
    const selects = document.querySelectorAll("select");
    if(selects.length < 5) return;

    const jogoSelect = selects[0];
    const fabricanteSelect = selects[1];
    const modeloSelect = selects[2];
    const nivelSelect = selects[3];
    const dedosSelect = selects[4];
    const btnGerar = document.querySelector("button");

    // 1. Arruma os selects de NIVEL e DEDOS que estão como "Selecione"
    nivelSelect.innerHTML = `
      <option value="">Selecione</option>
      <option value="baixa">Baixa</option>
      <option value="media" selected>Média</option>
      <option value="alta">Alta</option>
    `;
    dedosSelect.innerHTML = `
      <option value="">Selecione</option>
      <option value="2">2 dedos</option>
      <option value="3">3 dedos</option>
      <option value="4">4 dedos</option>
    `;

    // 2. Quando escolher FABRICANTE, libera MODELO
    function carregarModelos(){
      const fab = fabricanteSelect.value;
      modeloSelect.innerHTML = "";
      if(!DADOS[fab]){
        modeloSelect.innerHTML = '<option value="">Primeiro selecione o fabricante</option>';
        modeloSelect.disabled = true;
        return;
      }
      modeloSelect.disabled = false;
      modeloSelect.innerHTML = '<option value="">Selecione o modelo</option>';
      DADOS[fab].forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = m;
        modeloSelect.appendChild(opt);
      });
    }

    fabricanteSelect.addEventListener("change", carregarModelos);

    // 3. Botão GERAR
    btnGerar.addEventListener("click", function(e){
      e.preventDefault();
      if(!fabricanteSelect.value){ alert("Selecione o fabricante!"); return; }
      if(!modeloSelect.value){ alert("Selecione o modelo!"); return; }
      if(!nivelSelect.value){ alert("Selecione o nível!"); return; }

      const base = NIVEIS[nivelSelect.value] || 140;
      const ajusteDedos = DEDOS_AJUSTE[dedosSelect.value] || 0;
      // peso do celular (quanto mais novo, mais alta)
      const idxModelo = DADOS[fabricanteSelect.value].indexOf(modeloSelect.value);
      const ajusteModelo = idxModelo;

      const geral = limitar(base + ajusteDedos + ajusteModelo + aleatorio());

      const sensiFinal = {
        Geral: geral,
        "Ponto Vermelho": limitar(geral - 2 + aleatorio()),
        "Mira 2x": limitar(geral - 12 + aleatorio()),
        "Mira 4x": limitar(geral - 25 + aleatorio()),
        "Mira AWM": limitar(geral - 35 + aleatorio()),
        "Olhadinha": limitar(geral - 15 + aleatorio())
      };

      // Mostra o resultado (cria div se não existir)
      let resDiv = document.getElementById("resultado-goat");
      if(!resDiv){
        resDiv = document.createElement("div");
        resDiv.id = "resultado-goat";
        resDiv.style.cssText = "margin-top:20px;padding:18px;border-radius:18px;background:#0b0b0b;border:1px solid rgba(255,0,0,.35);color:white;";
        btnGerar.parentElement.appendChild(resDiv);
      }
      resDiv.innerHTML = `
        <div style="text-align:center;color:#ff2525;font-weight:900;margin-bottom:12px;">SENSIBILIDADE GERADA - ${fabricanteSelect.value} ${modeloSelect.value}</div>
        ${Object.entries(sensiFinal).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:10px 5px;border-bottom:1px solid #222;"><span>${k}</span><span style="background:linear-gradient(145deg,#ff2525,#a00000);padding:5px 12px;border-radius:8px;font-weight:900;">${v}</span></div>`).join("")}
        <button id="copiar-goat" style="width:100%;margin-top:15px;padding:14px;border-radius:12px;border:1px solid red;background:#222;color:white;font-weight:900;cursor:pointer;">📋 COPIAR SENSI</button>
      `;
      resDiv.scrollIntoView({behavior:"smooth"});

      document.getElementById("copiar-goat").onclick = async () => {
        const txt = `GOAT SENSI - ${fabricanteSelect.value} ${modeloSelect.value}\n` + Object.entries(sensiFinal).map(([k,v])=>`${k}: ${v}`).join("\n");
        try{ await navigator.clipboard.writeText(txt); alert("✅ Copiado!"); }catch{
          const a=document.createElement("textarea"); a.value=txt; document.body.appendChild(a); a.select(); document.execCommand("copy"); document.body.removeChild(a); alert("✅ Copiado!");
        }
      };
    });
  });
})();
          </script>
