<script>
var gerar = document.getElementById("gerar");

gerar.onclick = function () {

    var jogo = document.getElementById("jogo");
    var fabricante = document.getElementById("fabricante");
    var modelo = document.getElementById("modelo");
    var nivel = document.getElementById("nivel");
    var dedos = document.getElementById("dedos");
    var aviso = document.getElementById("aviso");
    var resultado = document.getElementById("resultado");

    aviso.style.display = "none";

    if (jogo.value === "") {
        aviso.textContent = "Selecione o jogo.";
        aviso.style.display = "block";
        return;
    }

    if (fabricante.value === "") {
        aviso.textContent = "Selecione o fabricante.";
        aviso.style.display = "block";
        return;
    }

    if (modelo.value === "") {
        aviso.textContent = "Selecione o modelo.";
        aviso.style.display = "block";
        return;
    }

    if (nivel.value === "") {
        aviso.textContent = "Selecione o estilo.";
        aviso.style.display = "block";
        return;
    }

    if (dedos.value === "") {
        aviso.textContent = "Selecione quantos dedos você usa.";
        aviso.style.display = "block";
        return;
    }

    /* GERA A CONFIGURAÇÃO DIRETAMENTE */

    var base = 150;

    if (nivel.value === "controle") {
        base = 137;
    }

    if (nivel.value === "equilibrada") {
        base = 157;
    }

    if (nivel.value === "rapida") {
        base = 178;
    }

    if (dedos.value === "2") {
        base -= 3;
    }

    if (dedos.value === "3") {
        base += 2;
    }

    if (dedos.value === "4") {
        base += 5;
    }

    if (jogo.value === "max") {
        base += 3;
    }

    if (fabricante.value === "Samsung") {
        base += 1;
    }

    if (fabricante.value === "Xiaomi") {
        base += 3;
    }

    var geralValor = Math.round(base);

    var redValor = geralValor - 4;
    var m2Valor = geralValor - 16;
    var m4Valor = geralValor - 31;
    var awmValor = geralValor - 49;
    var olhoValor = geralValor - 1;

    /* LIMITA OS VALORES */

    if (redValor < 0) redValor = 0;
    if (m2Valor < 0) m2Valor = 0;
    if (m4Valor < 0) m4Valor = 0;
    if (awmValor < 0) awmValor = 0;
    if (olhoValor < 0) olhoValor = 0;

    /* MOSTRA SENSIBILIDADE */

    document.getElementById("geral").textContent = geralValor;
    document.getElementById("red").textContent = redValor;
    document.getElementById("m2x").textContent = m2Valor;
    document.getElementById("m4x").textContent = m4Valor;
    document.getElementById("awm").textContent = awmValor;
    document.getElementById("olhadinha").textContent = olhoValor;

    /* DPI */

    var dpiValor = 520;

    if (fabricante.value === "Samsung") dpiValor = 560;
    if (fabricante.value === "Xiaomi") dpiValor = 600;
    if (fabricante.value === "Motorola") dpiValor = 540;

    if (modelo.value.indexOf("POCO") >= 0) dpiValor += 40;
    if (modelo.value.indexOf("S23") >= 0) dpiValor += 60;
    if (modelo.value.indexOf("S24") >= 0) dpiValor += 60;
    if (modelo.value.indexOf("S25") >= 0) dpiValor += 60;
    if (modelo.value.indexOf("Edge") >= 0) dpiValor += 30;

    document.getElementById("dpi").textContent = dpiValor;

    /* BOTÃO */

    var botaoValor = 50;

    if (nivel.value === "controle") botaoValor = 52;
    if (nivel.value === "rapida") botaoValor = 47;

    if (dedos.value === "2") botaoValor += 3;
    if (dedos.value === "4") botaoValor -= 2;

    document.getElementById("botao").textContent = botaoValor + "%";

    /* ESPECIALIDADE */

    var especialidadeValor = "EQUILIBRADA";
    var operacionalValor = "ALTO";

    if (geralValor >= 170) {
        especialidadeValor = "CAPA + RUSH";
        operacionalValor = "ALTÍSSIMO";
    } else if (redValor >= 145) {
        especialidadeValor = "PRECISÃO";
        operacionalValor = "ALTO";
    } else if (geralValor < 150) {
        especialidadeValor = "CONTROLE";
        operacionalValor = "ESTÁVEL";
    }

    document.getElementById("especialidade").textContent = especialidadeValor;
    document.getElementById("operacional").textContent = operacionalValor;

    /* ANÁLISE */

    document.getElementById("analise").textContent =
        "Configuração " + especialidadeValor.toLowerCase() +
        " criada para " + fabricante.value +
        " " + (modelo.value.split("|")[1] || modelo.value) +
        ". O motor GOAT combinou sensibilidade, DPI e botão de tiro de acordo com o estilo escolhido.";

    /* QUALIDADE */

    var qualidadeValor = 90;

    if (nivel.value === "equilibrada") qualidadeValor = 95;
    if (dedos.value === "3") qualidadeValor += 2;
    if (dedos.value === "4") qualidadeValor += 3;

    if (qualidadeValor > 99) qualidadeValor = 99;

    document.getElementById("qualidade").textContent =
        qualidadeValor + "%";

    document.getElementById("qualityFill").style.width =
        qualidadeValor + "%";

    /* IA */

    var scoreValor = 85;

    if (geralValor >= 170) scoreValor += 7;
    if (redValor >= 145) scoreValor += 3;
    if (dedos.value === "3") scoreValor += 2;
    if (dedos.value === "4") scoreValor += 3;

    if (scoreValor > 99) scoreValor = 99;

    document.getElementById("score").textContent = scoreValor;

    document.getElementById("tags").innerHTML =
        '<div class="tag special">🎯 ' + especialidadeValor + '</div>' +
        '<div class="tag">⚡ DPI ' + dpiValor + '</div>' +
        '<div class="tag">🔘 Botão ' + botaoValor + '%</div>' +
        '<div class="tag">🎮 ' + dedos.value + ' dedos</div>';

    document.getElementById("aiText").innerHTML =
        "<b>Análise GOAT:</b> Esta configuração foi identificada como " +
        "<b>" + especialidadeValor.toLowerCase() + "</b>. " +
        "DPI recomendada: <b>" + dpiValor +
        "</b> e botão de tiro: <b>" + botaoValor + "%</b>.";

    /* DISPOSITIVO */

    document.getElementById("resultDevice").textContent =
        fabricante.value + " " +
        (modelo.value.split("|")[1] || modelo.value) +
        " • " + dedos.value + " dedos";

    /* MOSTRA RESULTADO */

    resultado.style.display = "block";

    resultado.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
};
</script>
